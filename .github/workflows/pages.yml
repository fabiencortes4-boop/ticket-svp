# Publie le dossier www/ sur GitHub Pages à chaque envoi sur main
name: Site du jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Site = jeu + APK Android
        run: |
          cp -r www _site
          cp "$(ls dist/ticket-svp-*.apk | sort -V | tail -1)" _site/ticket-svp.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
